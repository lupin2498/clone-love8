name: Build iOS IPA

on:
  push:
    branches: ['**']
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen & ldid
        run: |
          brew install xcodegen
          brew install ldid || echo "ldid not available, IPA will be left unsigned"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Love8Clone.xcodeproj \
            -scheme Love8Clone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Print compiler errors
        if: failure()
        working-directory: ios
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package IPA (fake-signed with entitlements)
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/Love8Clone.app
          if command -v ldid >/dev/null; then
            if [ -d "$APP/PlugIns/Love8Widget.appex" ]; then
              ldid -SLove8Widget/Love8Widget.entitlements "$APP/PlugIns/Love8Widget.appex/Love8Widget" || true
            fi
            ldid -SLove8Clone/Love8Clone.entitlements "$APP/Love8Clone" || true
          fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry "Love8Clone-ios-v1.0.${{ github.run_number }}.ipa" Payload
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: Love8Clone-ipa
          path: ios/out/*.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0.${{ github.run_number }}
          name: Love8 Clone iOS v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ios/out/*.ipa
          body: |
            Bộ cài iOS (IPA chưa ký) build tự động từ commit ${{ github.sha }}.
            Cài bằng Sideloadly / AltStore / TrollStore (xem README).
